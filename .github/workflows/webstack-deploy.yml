name: Webstack deployment

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode
        type: choice
        required: true
        default: deploy-webapp
        options:
          - deploy-webapp
          - provision-db
          - inject-data
          - full-deploy
      app_name:
        description: App name on the VM (required for deploy-webapp and full-deploy)
        required: false
        default: app_a
      app_domain:
        description: Domain used to create the app when it does not exist
        required: false
        default: ""
      container_port:
        description: Container port used when creating the app
        type: number
        required: false
        default: 0
      host_port:
        description: Loopback host port used when creating the app
        type: number
        required: false
        default: 0
      database_name:
        description: Database name (required for provision-db and inject-data/full-deploy)
        required: false
        default: ""
      database_user:
        description: Database user/role name
        required: false
        default: ""
      sql_file:
        description: Repository SQL or SQL.GZ path; large files are staged through private Blob Storage
        required: false
        default: ""
      image:
        description: Existing immutable GHCR image; leave empty to build this repository
        required: false
        default: ""
      ref:
        description: Caller Git ref to check out and build
        required: false
        default: ""
  workflow_call:
    inputs:
      mode:
        description: deploy-webapp, provision-db, inject-data, or full-deploy
        type: string
        required: true
      app_name:
        type: string
        required: false
        default: ""
      app_domain:
        type: string
        required: false
        default: ""
      container_port:
        type: number
        required: false
        default: 0
      host_port:
        type: number
        required: false
        default: 0
      image:
        description: Existing immutable GHCR image; leave empty to build the caller repository
        type: string
        required: false
        default: ""
      ref:
        description: Caller Git ref to check out and build
        type: string
        required: false
        default: ""
      database_name:
        type: string
        required: false
        default: ""
      database_user:
        type: string
        required: false
        default: ""
      sql_file:
        description: SQL or SQL.GZ path in the caller repository
        type: string
        required: false
        default: ""
      operations_dockerfile:
        description: Optional Dockerfile for application migrations or seed operations
        type: string
        required: false
        default: ""
      operations_command:
        description: Command to run in the operations image before deploying the webapp
        type: string
        required: false
        default: ""
      release_env_var:
        description: Optional app.env variable populated from the immutable image tag
        type: string
        required: false
        default: ""
      database_url_query:
        description: Query parameters merged into the generated DATABASE_URL
        type: string
        required: false
        default: ""
    secrets:
      DATABASE_PASSWORD:
        description: Required by provision-db and full-deploy
        required: false
      APPLICATION_ENV:
        description: Optional KEY=VALUE lines merged into the root-only application environment
        required: false

permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  build:
    if: ${{ (inputs.mode == 'deploy-webapp' || inputs.mode == 'full-deploy') && inputs.image == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      - name: Determine image tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}:$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-operations:
    if: ${{ (inputs.mode == 'deploy-webapp' || inputs.mode == 'full-deploy') && inputs.operations_dockerfile != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      - name: Determine operations image tag
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-ops:$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.operations_dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build, build-operations]
    if: >-
      ${{
        always()
        && (needs.build.result == 'success' || needs.build.result == 'skipped')
        && (needs.build-operations.result == 'success' || needs.build-operations.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: webstack-${{ inputs.app_name != '' && inputs.app_name || inputs.database_name }}
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Execute remote operation
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          APP_NAME: ${{ inputs.app_name != '' && inputs.app_name || vars.APP_NAME }}
          APP_DOMAIN: ${{ inputs.app_domain }}
          CONTAINER_PORT: ${{ inputs.container_port }}
          HOST_PORT: ${{ inputs.host_port }}
          IMAGE: ${{ inputs.image != '' && inputs.image || needs.build.outputs.image }}
          DB_NAME: ${{ inputs.database_name }}
          DB_USER: ${{ inputs.database_user }}
          DB_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          SQL_FILE: ${{ inputs.sql_file }}
          OPERATIONS_DOCKERFILE: ${{ inputs.operations_dockerfile }}
          OPERATIONS_COMMAND: ${{ inputs.operations_command }}
          OPERATIONS_IMAGE: ${{ needs.build-operations.outputs.image }}
          RELEASE_ENV_VAR: ${{ inputs.release_env_var }}
          DATABASE_URL_QUERY: ${{ inputs.database_url_query }}
          APPLICATION_ENV: ${{ secrets.APPLICATION_ENV }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
        run: |
          set -Eeuo pipefail
          [[ -n "$RESOURCE_GROUP" && -n "$VM_NAME" ]]
          EXPECTED_MARKER=""
          SQL_PATH=""
          BLOB_NAME=""
          BLOB_SHA256=""
          STORAGE_ACCOUNT=""
          STORAGE_CONTAINER=""
          TRANSFER_KEY=""
          TRANSFER_MARKER=""
          SSH_TARGET=""
          SSH_PORT=""
          HOSTS_MARKER=""
          [[ -z "$OPERATIONS_DOCKERFILE" && -z "$OPERATIONS_COMMAND" \
              || -n "$OPERATIONS_DOCKERFILE" && -n "$OPERATIONS_COMMAND" ]] || {
            echo "operations_dockerfile and operations_command must be supplied together" >&2
            exit 1
          }
          if [[ -n "$OPERATIONS_DOCKERFILE" ]]; then
            [[ "$MODE" == deploy-webapp || "$MODE" == full-deploy ]] || {
              echo "Application operations are only supported for deploy-webapp and full-deploy" >&2
              exit 1
            }
            [[ "$OPERATIONS_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+:[a-f0-9]{40}$ ]] || {
              echo "The operations image must use an immutable commit tag" >&2
              exit 1
            }
          fi
          if [[ -n "$RELEASE_ENV_VAR" && ! "$RELEASE_ENV_VAR" =~ ^[A-Z_][A-Z0-9_]*$ ]]; then
            echo "release_env_var must be an uppercase environment variable name" >&2
            exit 1
          fi
          if [[ -n "$APP_DOMAIN" || "$CONTAINER_PORT" != 0 || "$HOST_PORT" != 0 ]]; then
            [[ "$MODE" == deploy-webapp || "$MODE" == full-deploy ]] || {
              echo "App provisioning inputs are only supported for deploy-webapp and full-deploy" >&2
              exit 1
            }
            [[ "$APP_DOMAIN" =~ ^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$ ]] || {
              echo "app_domain must be a lowercase public DNS hostname" >&2
              exit 1
            }
            ((CONTAINER_PORT >= 1 && CONTAINER_PORT <= 65535)) || {
              echo "container_port must be from 1 through 65535" >&2
              exit 1
            }
            ((HOST_PORT >= 1024 && HOST_PORT <= 65535)) || {
              echo "host_port must be from 1024 through 65535" >&2
              exit 1
            }
          fi
          database_query_pattern='^[A-Za-z0-9._~%=&+-]+$'
          if [[ -n "$DATABASE_URL_QUERY" && ! "$DATABASE_URL_QUERY" =~ $database_query_pattern ]]; then
            echo "database_url_query contains unsupported characters" >&2
            exit 1
          fi
          case "$MODE" in
            provision-db)
              [[ -n "$DB_NAME" && -n "$DB_USER" && -n "$DB_PASSWORD" ]] || {
                echo "provision-db requires database_name, database_user and the DATABASE_PASSWORD secret" >&2
                exit 1
              }
              EXPECTED_MARKER="WEBSTACK_DB_PROVISION_OK $DB_NAME $DB_USER"
              ;;
            inject-data)
              [[ -n "$DB_NAME" && -n "$SQL_FILE" ]] || {
                echo "inject-data requires database_name and sql_file" >&2
                exit 1
              }
              EXPECTED_MARKER="WEBSTACK_DB_INJECT_OK $DB_NAME"
              ;;
            deploy-webapp)
              [[ -n "$APP_NAME" && -n "$IMAGE" ]] || {
                echo "deploy-webapp requires app_name and image" >&2
                exit 1
              }
              EXPECTED_MARKER="WEBSTACK_DEPLOY_OK $APP_NAME"
              ;;
            full-deploy)
              [[ -n "$DB_NAME" && -n "$DB_USER" && -n "$DB_PASSWORD" && -n "$SQL_FILE" ]] || {
                echo "full-deploy requires database_name, database_user, sql_file and the DATABASE_PASSWORD secret" >&2
                exit 1
              }
              [[ -n "$APP_NAME" && -n "$IMAGE" ]] || {
                echo "full-deploy requires app_name and image" >&2
                exit 1
              }
              EXPECTED_MARKER="WEBSTACK_FULL_DEPLOY_OK $APP_NAME"
              ;;
            *)
              echo "Unsupported deployment mode: $MODE" >&2
              exit 1
              ;;
          esac

          if [[ "$MODE" == inject-data || "$MODE" == full-deploy ]]; then
            SQL_PATH="$(realpath -e -- "$GITHUB_WORKSPACE/$SQL_FILE")"
            [[ "$SQL_PATH" == "$GITHUB_WORKSPACE/"* && -f "$SQL_PATH" && ! -L "$SQL_PATH" ]] || {
              echo "sql_file must be a regular file inside the checked-out repository" >&2
              exit 1
            }
            [[ "$SQL_PATH" == *.sql || "$SQL_PATH" == *.sql.gz ]] || {
              echo "sql_file must end in .sql or .sql.gz" >&2
              exit 1
            }
          fi

          cleanup() {
            set +e
            if [[ -n "$BLOB_NAME" && -n "$STORAGE_ACCOUNT" && -n "$STORAGE_CONTAINER" \
                && -n "$SSH_TARGET" ]]; then
              az storage blob delete --auth-mode login \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$STORAGE_CONTAINER" \
                --name "$BLOB_NAME" --only-show-errors
            fi
            if [[ -n "$SSH_TARGET" ]]; then
              sudo ssh -S "$RUNNER_TEMP/tunnel-control" -O exit "$SSH_TARGET" 2>/dev/null
              sudo rm -f -- "$RUNNER_TEMP/tunnel-control"
            fi
            if [[ -n "$HOSTS_MARKER" ]]; then
              sudo sed -i "\|$HOSTS_MARKER|d" /etc/hosts
            fi
            if [[ -n "$TRANSFER_MARKER" ]]; then
              printf '#!/usr/bin/env bash\nset -Eeuo pipefail\nmarker=%q\n' \
                "$TRANSFER_MARKER" > "$RUNNER_TEMP/cleanup-transfer.sh"
              cat >> "$RUNNER_TEMP/cleanup-transfer.sh" <<'SH'
          python3 - "$marker" <<'PY'
          from pathlib import Path
          import os
          import pwd
          import sys

          suffix = " " + sys.argv[1]
          for path in Path("/home").glob("*/.ssh/authorized_keys"):
              lines = path.read_text().splitlines()
              updated = [line for line in lines if not line.endswith(suffix)]
              if updated != lines:
                  path.write_text("".join(line + "\n" for line in updated))
                  user = pwd.getpwnam(path.parts[2])
                  os.chown(path, user.pw_uid, user.pw_gid)
                  path.chmod(0o600)
          PY
          SH
              az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" \
                --command-id RunShellScript --scripts @"$RUNNER_TEMP/cleanup-transfer.sh" \
                --only-show-errors --output none
            fi
            rm -f -- "$TRANSFER_KEY" "$TRANSFER_KEY.pub" \
              "$RUNNER_TEMP/staged-import.sql.gz"
          }
          trap cleanup EXIT

          if [[ -n "$SQL_PATH" && $(wc -c < "$SQL_PATH") -gt 65536 ]]; then
            TRANSFER_KEY="$RUNNER_TEMP/webstack-transfer"
            TRANSFER_MARKER="webstack-import-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            HOSTS_MARKER="# $TRANSFER_MARKER"
            ssh-keygen -q -t ed25519 -N "" -C "$TRANSFER_MARKER" -f "$TRANSFER_KEY"
            transfer_public_key="$(cut -d ' ' -f 1,2 "$TRANSFER_KEY.pub")"
            printf '#!/usr/bin/env bash\nset -Eeuo pipefail\nkey=%q\nmarker=%q\n' \
              "$transfer_public_key" "$TRANSFER_MARKER" > "$RUNNER_TEMP/setup-transfer.sh"
            cat >> "$RUNNER_TEMP/setup-transfer.sh" <<'SH'
          config=/etc/webstack/config.json
          readarray -t values < <(python3 - "$config" <<'PY'
          import json, sys
          config = json.load(open(sys.argv[1]))
          for name in ("storage_account", "admin_username", "ssh_port"):
              print(config[name])
          PY
          )
          account=${values[0]}
          admin=${values[1]}
          port=${values[2]}
          home=$(getent passwd "$admin" | cut -d: -f6)
          [[ -n "$home" && "$home" == /home/* ]]
          install -d -m 0700 -o "$admin" -g "$admin" "$home/.ssh"
          touch "$home/.ssh/authorized_keys"
          chown "$admin:$admin" "$home/.ssh/authorized_keys"
          chmod 0600 "$home/.ssh/authorized_keys"
          grep -Fq " $marker" "$home/.ssh/authorized_keys" \
            || printf '%s %s\n' "$key" "$marker" >> "$home/.ssh/authorized_keys"
          public_ip=$(curl -fsS -H Metadata:true \
            'http://169.254.169.254/metadata/instance/network/interface/0/ipv4/ipAddress/0/publicIpAddress?api-version=2021-02-01&format=text')
          printf 'WEBSTACK_TRANSFER account %s\n' "$account"
          printf 'WEBSTACK_TRANSFER container db-imports\n'
          printf 'WEBSTACK_TRANSFER user %s\n' "$admin"
          printf 'WEBSTACK_TRANSFER port %s\n' "$port"
          printf 'WEBSTACK_TRANSFER ip %s\n' "$public_ip"
          printf 'WEBSTACK_TRANSFER hostkey %s\n' "$(cat /etc/ssh/ssh_host_ed25519_key.pub)"
          SH
            az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" \
              --command-id RunShellScript --scripts @"$RUNNER_TEMP/setup-transfer.sh" \
              --only-show-errors --output json > "$RUNNER_TEMP/transfer-result.json"
            python3 - "$RUNNER_TEMP/transfer-result.json" "$RUNNER_TEMP/transfer.json" <<'PY'
          import ipaddress
          import json
          import re
          import sys

          result = json.load(open(sys.argv[1]))
          messages = "\n".join(item.get("message", "") for item in result.get("value", []))
          values = {}
          for line in messages.splitlines():
              if line.startswith("WEBSTACK_TRANSFER "):
                  _, _, name, value = line.split(" ", 3)
                  values[name] = value
          required = {"account", "container", "user", "port", "ip", "hostkey"}
          if values.keys() < required:
              raise SystemExit("VM did not return complete private transfer information")
          if not re.fullmatch(r"[a-z0-9]{3,24}", values["account"]):
              raise SystemExit("VM returned an invalid storage account")
          if values["container"] != "db-imports":
              raise SystemExit("VM returned an invalid import container")
          if not re.fullmatch(r"[a-z_][a-z0-9_-]{0,31}", values["user"]):
              raise SystemExit("VM returned an invalid SSH user")
          if not 1024 <= int(values["port"]) <= 65535:
              raise SystemExit("VM returned an invalid SSH port")
          ipaddress.ip_address(values["ip"])
          if not re.fullmatch(r"ssh-ed25519 [A-Za-z0-9+/=]+(?: .*)?", values["hostkey"]):
              raise SystemExit("VM returned an invalid SSH host key")
          json.dump(values, open(sys.argv[2], "w"))
          PY
            readarray -t transfer < <(python3 - "$RUNNER_TEMP/transfer.json" <<'PY'
          import json, sys
          values = json.load(open(sys.argv[1]))
          for name in ("account", "container", "user", "port", "ip", "hostkey"):
              print(values[name])
          PY
          )
            STORAGE_ACCOUNT=${transfer[0]}
            STORAGE_CONTAINER=${transfer[1]}
            ssh_user=${transfer[2]}
            ssh_port=${transfer[3]}
            ssh_ip=${transfer[4]}
            read -r host_key_type host_key_value _ <<< "${transfer[5]}"
            printf '[%s]:%s %s %s\n' "$ssh_ip" "$ssh_port" \
              "$host_key_type" "$host_key_value" > "$RUNNER_TEMP/known_hosts"
            printf '127.0.0.1 %s.blob.core.windows.net %s\n' \
              "$STORAGE_ACCOUNT" "$HOSTS_MARKER" | sudo tee -a /etc/hosts >/dev/null
            SSH_TARGET="$ssh_user@$ssh_ip"
            SSH_PORT="$ssh_port"
            sudo ssh -M -S "$RUNNER_TEMP/tunnel-control" -fN \
              -i "$TRANSFER_KEY" -p "$SSH_PORT" \
              -o BatchMode=yes -o ExitOnForwardFailure=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -L "443:${STORAGE_ACCOUNT}.blob.core.windows.net:443" \
              "$SSH_TARGET"
            (exec 3<>/dev/tcp/127.0.0.1/443) 2>/dev/null || {
              echo "Private Blob SSH tunnel did not become ready" >&2
              exit 1
            }
            if [[ "$SQL_PATH" == *.gz ]]; then
              cp -- "$SQL_PATH" "$RUNNER_TEMP/staged-import.sql.gz"
            else
              gzip -c -- "$SQL_PATH" > "$RUNNER_TEMP/staged-import.sql.gz"
            fi
            BLOB_SHA256="$(sha256sum "$RUNNER_TEMP/staged-import.sql.gz" | cut -d ' ' -f1)"
            BLOB_NAME="imports/${GITHUB_REPOSITORY}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/seed.sql.gz"
            az storage blob upload --auth-mode login \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$STORAGE_CONTAINER" \
              --name "$BLOB_NAME" \
              --file "$RUNNER_TEMP/staged-import.sql.gz" \
              --overwrite true --only-show-errors
          fi

          python3 - "$RUNNER_TEMP/webstack-ops.sh" "$SQL_PATH" "$BLOB_NAME" \
            "$BLOB_SHA256" "$STORAGE_ACCOUNT" "$STORAGE_CONTAINER" <<'PY'
          import base64
          import os
          from pathlib import Path
          import shlex
          import sys

          output, sql_path, blob_name, blob_sha256, storage_account, storage_container = sys.argv[1:]
          mode = os.environ["MODE"]
          app = os.environ["APP_NAME"]
          app_domain = os.environ["APP_DOMAIN"]
          container_port = os.environ["CONTAINER_PORT"]
          host_port = os.environ["HOST_PORT"]
          image = os.environ["IMAGE"]
          database = os.environ["DB_NAME"]
          user = os.environ["DB_USER"]
          password = os.environ["DB_PASSWORD"]
          operations_image = os.environ["OPERATIONS_IMAGE"]
          operations_command = os.environ["OPERATIONS_COMMAND"]
          release_env_var = os.environ["RELEASE_ENV_VAR"]
          database_url_query = os.environ["DATABASE_URL_QUERY"]
          application_env = os.environ["APPLICATION_ENV"]
          registry_user = os.environ["REGISTRY_USER"]
          registry_token = os.environ["REGISTRY_TOKEN"]
          def quote(value):
              return shlex.quote(value)

          compressed = sql_path.endswith(".gz")
          lines = [
              "#!/usr/bin/env bash",
              "set -Eeuo pipefail",
              "umask 077",
              f"seed=/tmp/webstack-seed-$$.sql{'.gz' if compressed else ''}",
              "docker_config=/tmp/webstack-docker-$$",
              "trap 'rm -f -- \"$seed\"; rm -rf -- \"$docker_config\"' EXIT",
          ]
          if registry_token:
              lines.extend([
                  'install -d -m 0700 "$docker_config"',
                  'export DOCKER_CONFIG="$docker_config"',
                  f"printf %s {quote(registry_token)} | "
                  f"docker login ghcr.io --username {quote(registry_user)} "
                  "--password-stdin >/dev/null",
              ])
          if sql_path and not blob_name:
              encoded = base64.b64encode(Path(sql_path).read_bytes()).decode()
              lines.append(f"printf %s {quote(encoded)} | base64 -d > \"$seed\"")
          if mode in ("provision-db", "full-deploy"):
              lines.append(
                  f"WEBSTACK_DB_PASSWORD={quote(password)} /usr/local/sbin/webstack-db "
                  f"provision --db {quote(database)} --user {quote(user)}"
              )
          if mode in ("inject-data", "full-deploy"):
              if blob_name:
                  lines.append(
                      f"/usr/local/sbin/webstack-db inject-blob --db {quote(database)} "
                      f"--account {quote(storage_account)} --container {quote(storage_container)} "
                      f"--blob {quote(blob_name)} --sha256 {quote(blob_sha256)}"
                  )
              else:
                  lines.append(
                      f"/usr/local/sbin/webstack-db inject --db {quote(database)} "
                      '--sql-file "$seed"'
                  )
          if mode in ("deploy-webapp", "full-deploy"):
              app_directory = f"/data/apps/{app}"
              if app_domain:
                  lines.extend([
                      f"if [[ ! -d {quote(app_directory)} ]]; then",
                      f"  /usr/local/sbin/webstack-create-app {quote(app)} "
                      f"{quote(app_domain)} --container-port {quote(container_port)} "
                      f"--host-port {quote(host_port)}",
                      "fi",
                  ])
                  verify_app = (
                      "import json,sys; d=json.load(open(sys.argv[1])); "
                      "expected={'app':sys.argv[2],'domain':sys.argv[3],"
                      "'container_port':int(sys.argv[4]),'host_port':int(sys.argv[5])}; "
                      "actual={k:d.get(k) for k in expected}; "
                      "sys.exit(0 if actual == expected else "
                      "'Existing app configuration does not match workflow inputs')"
                  )
                  lines.append(
                      f"python3 -c {quote(verify_app)} "
                      f"{quote(app_directory + '/app.json')} {quote(app)} "
                      f"{quote(app_domain)} {quote(container_port)} {quote(host_port)}"
                  )
              lines.append(f"test -f {quote(app_directory + '/app.env')}")
              if application_env or database_url_query:
                  import base64
                  encoded_environment = base64.b64encode(
                      application_env.encode()
                  ).decode()
                  merge_environment = """
          import base64
          from pathlib import Path
          import re
          import sys
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          path = Path(sys.argv[1])
          incoming = base64.b64decode(sys.argv[2]).decode()
          database_query = sys.argv[3]
