name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      # Run your application's tests here before building.
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: echo "name=ghcr.io/${REPOSITORY,,}:${COMMIT}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
          APP_NAME: ${{ vars.APP_NAME }}
          IMAGE: ${{ needs.build.outputs.image }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$APP_NAME" =~ ^[a-z][a-z0-9_]{0,39}$ ]]
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+:[a-f0-9]{40}$ ]]
          [[ -n "$RESOURCE_GROUP" && -n "$VM_NAME" ]]
          printf '#!/usr/bin/env bash\nset -Eeuo pipefail\n/usr/local/sbin/webstack-deploy %q %q\n' \
            "$APP_NAME" "$IMAGE" > "$RUNNER_TEMP/deploy.sh"
          az vm run-command invoke --resource-group "$RESOURCE_GROUP" --name "$VM_NAME" \
            --command-id RunShellScript --scripts @"$RUNNER_TEMP/deploy.sh" \
            --output json > "$RUNNER_TEMP/result.json"
          python3 - "$RUNNER_TEMP/result.json" "$APP_NAME" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          messages = "\n".join(item.get("message", "") for item in result.get("value", []))
          print(messages)
          if "WEBSTACK_DEPLOY_OK " + sys.argv[2] not in messages:
              raise SystemExit("VM deployment failed; inspect its output and application logs")
          PY
